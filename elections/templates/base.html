<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleições</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
      .active-custom {
        font-weight: 600;
        -webkit-box-shadow:inset 0 2px 0 0 #000;
        -moz-box-shadow:inset 0 2px 0 0 #000;
        box-shadow:inset 0 2px 0 0 #000;
      }
      .custom-accordion-button {
        font-weight: 500;
      }
      .accordion-button-custom {
        --bs-accordion-active-bg: white;
        --bs-accordion-active-color: none;
        --bs-accordion-btn-bg: #f5f5f5;
        --bs-accordion-border-color: none;
        padding-top: 6px;
        padding-bottom: 6px;
        border-radius: .25rem;
      }
      .accordion-button-custom:disabled {
        opacity: 50%;
        cursor: not-allowed;
      }

      .accordion-header-custom {
        --bs-accordion-btn-focus-box-shadow: none;
      }

      .accordion-item-custom {
        --bs-accordion-border-radius: .25rem;
        border-top: 1px solid var(--bs-accordion-border-color) !important;
        border-end-end-radius: .25rem;
        border-end-start-radius: .25rem;
        border-start-end-radius: .25rem;
        border-start-start-radius: .25rem;
      }
      .accordion-body-custom {
        font-weight: 300;
      }

      .table-custom > thead > tr {
        border: 0;
      }
      .table-custom > thead > tr > th {
        border: 0;
      }
      .table-custom td {
        max-width: 200px;
        min-width: 200px;
      }
    </style>
  </head>
  <body class="d-flex flex-column h-100">
    <header>
      <nav class="navbar navbar-dark navbar-expand-lg py-3" style="background-color: #404493">
        <div class="container">
          <img src="brio.png" width="150px" class="d-none d-lg-block" />
          <img src="brio-no-text.png" width="50px" class="d-lg-none" />
          <span class="fs-5 fw-light text-white ms-0 me-0 ms-lg-3 me-lg-2">Eleições 2024</span>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link active fw-bold" aria-current="page" href="#">Home</a>
              <a class="nav-link" href="#">Busca</a>
              <a class="nav-link" href="#">Sobre</a>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="flex-shrink-0">
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      const copyToClipboard = async (textToCopy) => {
        // Navigator clipboard api needs a secure context (https)
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(textToCopy)
        } else {
          // Use the 'out of viewport hidden text area' trick
          const textArea = document.createElement("textarea")
          textArea.value = textToCopy

          // Move textarea out of the viewport so it's not visible
          textArea.style.position = "absolute"
          textArea.style.left = "-999999px"

          document.body.prepend(textArea)
          textArea.select()

          try {
            document.execCommand('copy')
          } catch (error) {
            // Do nothing
          } finally {
            textArea.remove()
          }
        }
      }
      const copyCurrentLink = async () => {
        try {
          const link = window.location.href
          await copyToClipboard(window.location.href)
          window.alert(`Link: ${link} copiado para a área de transferência`)
        } catch (e) {
          // Do nothing
        }
      }
    </script>
  </body>
</html>
