{% load static %}
<!DOCTYPE html>
<html class="h-100" lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}">
    <title>Eleições</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">

    {% block script %}
      <script async src="https://www.googletagmanager.com/gtag/js?id=UA-117698282-1"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'UA-117698282-1');
      </script>
      <script src="{% static 'js/jquery.js' %}"></script>
    {% endblock %}
    <style>
      .active-custom {
        font-weight: 600;
        -webkit-box-shadow:inset 0 2px 0 0 var(--bs-body-color);
        -moz-box-shadow:inset 0 2px 0 0 var(--bs-body-color);
        box-shadow:inset 0 2px 0 0 var(--bs-body-color);
      }
      .custom-accordion-button {
        font-weight: 500;
      }
      .accordion-button-custom {
        --bs-accordion-active-bg: var(--bs-body-bg);
        --bs-accordion-bg: var(--bs-body-bg);
        --bs-accordion-active-color: var(--bs-body-color);
        --bs-accordion-color: black;
        --bs-accordion-btn-bg: var(--bs-tertiary-bg);
        --bs-accordion-border-color: none;
        padding-top: 6px;
        padding-bottom: 6px;
        border-radius: .25rem;
      }

      [data-bs-theme="dark"] .accordion-button:not(.collapsed)::after,
      [data-bs-theme="dark"] .accordion-button::after {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23fff'%3e%3cpath fill-rule='evenodd' d='M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z'/%3e%3c/svg%3e");
      }

      .accordion-button-custom:disabled {
        opacity: 50%;
        cursor: not-allowed;
      }

      .accordion-header-custom {
        --bs-accordion-btn-focus-box-shadow: none;
      }

      .accordion-item-custom {
        --bs-accordion-border-radius: .25rem;
        border-top: 1px solid var(--bs-accordion-border-color) !important;
        border-end-end-radius: .25rem;
        border-end-start-radius: .25rem;
        border-start-end-radius: .25rem;
        border-start-start-radius: .25rem;
      }
      .accordion-body-custom {
        font-weight: 300;
      }

      .table-custom > thead > tr {
        border: 0;
      }
      .table-custom > thead > tr > th {
        border: 0;
      }
      .table-custom td {
        max-width: 200px;
        min-width: 200px;
      }

      .border-top-custom {
        border-top: 1px solid var(--bs-body-color);
      }
    </style>
  </head>
  <body class="d-flex flex-column h-100">
    <header>
      <nav class="navbar navbar-dark navbar-expand-lg py-3" style="background-color: #404493">
        <div class="container">
          <div class="navbar-brand py-0 d-flex justify-content-center align-items-center">
            <img
              src="{% static 'img/logo/logo_br-io_fundo-escuro-no-text.svg' %}"
              alt="Brasil.io logo"
              width="40px"
            />
            <span class="fs-4 ms-2 d-none d-lg-block">Brasil.io</span>
          </div>
          <span class="fs-5 fw-light text-white me-0 me-lg-2">Eleições 2024</span>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav d-flex justify-content-between w-100">
              <div class="d-flex flex-column flex-lg-row g-2 g-lg-0">
                <a class="nav-link active fw-bold" aria-current="page" href="#">Home</a>
                <a class="nav-link" href="#">Busca</a>
                <a class="nav-link" href="#">Sobre</a>
              </div>
              <div class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  id="bd-theme"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-circle-half"
                    viewBox="0 0 16 16"
                  >
                    <path d="M8 15A7 7 0 1 0 8 1zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16"/>
                  </svg>
                </a>
                <ul class="dropdown-menu">
                  <li>
                    <a type="button" class="dropdown-item" data-bs-theme-value="light">
                      Iluminado
                    </a>
                  </li>
                  <li>
                    <a type="button" class="dropdown-item" data-bs-theme-value="dark">
                      Escuro
                    </a>
                  </li>
                  <li>
                    <a type="button" class="dropdown-item" data-bs-theme-value="auto">
                      Automático
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="flex-shrink-0">
      {% block content %}{% endblock %}
    </main>

    {% block bodyscript %}

      <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
      <script src="{% static 'js/theme.js' %}"></script>
      <script>
        const copyToClipboard = async (textToCopy) => {
          // Navigator clipboard api needs a secure context (https)
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(textToCopy)
          } else {
            // Use the 'out of viewport hidden text area' trick
            const textArea = document.createElement("textarea")
            textArea.value = textToCopy

            // Move textarea out of the viewport so it's not visible
            textArea.style.position = "absolute"
            textArea.style.left = "-999999px"

            document.body.prepend(textArea)
            textArea.select()

            try {
              document.execCommand('copy')
            } catch (error) {
              // Do nothing
            } finally {
              textArea.remove()
            }
          }
        }
        const copyCurrentLink = async () => {
          try {
            const link = window.location.href
            await copyToClipboard(window.location.href)
            window.alert(`Link: ${link} copiado para a área de transferência`)
          } catch (e) {
            // Do nothing
          }
        }
      </script>

    {% endblock %}
  </body>
</html>
